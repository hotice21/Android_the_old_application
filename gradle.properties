# Kotlin code style: official (used by kotlin-stdlib extensions)
kotlin.code.style=official

# Run build using the Gradle daemon; reasonable default for developer machines.
org.gradle.daemon=true

# Build in parallel when possible.
org.gradle.parallel=true

# Use the local JDK to drive the toolchain; do not auto-download a JDK.
org.gradle.java.installations.auto-download=false

# Avoid issues with non-ASCII paths on Windows during compile.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
