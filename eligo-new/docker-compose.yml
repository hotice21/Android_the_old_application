services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eligo-api
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # Database
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-eligo}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: ${MYSQL_USER:-eligo}
      DB_PASSWORD: ${MYSQL_PASSWORD:-eligo123}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Security keys（开发环境用固定默认值即可，生产部署务必覆盖）
      JWT_SIGNING_KEY_BASE64: ${JWT_SIGNING_KEY_BASE64:-IB8eHRwbGhkYFxYVFBMSERAPDg0MCwoJCAcGBQQDAgE=}
      DATA_ENCRYPTION_KEY_BASE64: ${DATA_ENCRYPTION_KEY_BASE64:-AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
      DATA_LOOKUP_KEY_BASE64: ${DATA_LOOKUP_KEY_BASE64:-Hx4dHBsaGRgXFhUUExIREA8ODQwLCgkIBwYFBAMCAQA=}
      # WeChat (optional, fill for login feature)
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      # 测试阶段：默认关闭所有鉴权校验，前端开发免登录调接口
      # 生产部署务必设 ELIGO_SECURITY_ENABLED=true
      ELIGO_SECURITY_ENABLED: ${ELIGO_SECURITY_ENABLED:-false}
      DEV_USER_ID: ${DEV_USER_ID:-1}
      DEV_SESSION_KEY: ${DEV_SESSION_KEY:-dev-session}
      DEV_ADMIN: ${DEV_ADMIN:-true}
      # File storage
      FILE_STORAGE_PROVIDER: LOCAL
      FILE_STORAGE_LOCAL_ROOT: /data/eligo-files
    volumes:
      - eligo-files:/data/eligo-files
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 10

  mysql:
    image: mysql:8.4
    container_name: eligo-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eligo}
      MYSQL_USER: ${MYSQL_USER:-eligo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eligo123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: eligo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      sh -c '
        if [ -n "$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # H5 frontend served by nginx (proxies /api to the api service)
  web:
    build:
      context: ../eligo-frontend
      dockerfile: Dockerfile
    container_name: eligo-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  mysql-data:
  redis-data:
  eligo-files:
