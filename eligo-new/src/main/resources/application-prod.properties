spring.config.activate.on-profile=prod

server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

management.endpoint.health.group.readiness.include=readinessState,db,redis

server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

eligo.file.storage.provider=${FILE_STORAGE_PROVIDER:LOCAL}
eligo.file.storage.local-root=${FILE_STORAGE_LOCAL_ROOT}
eligo.file.image.allowed-content-types=image/jpeg,image/png
eligo.file.image.max-size=10MB
eligo.file.temporary-ttl=PT24H
eligo.file.export.max-files=20
eligo.file.export.max-structured-bytes=5242880
eligo.file.export.max-total-bytes=52428800

# 生产环境强制开启全部安全校验，不允许通过环境变量关闭
eligo.security.enabled=true
