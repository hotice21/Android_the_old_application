spring.config.activate.on-profile=docker

server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Database (service name from docker-compose)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Redis (service name from docker-compose)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# Flyway auto-migrate on startup
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Actuator health groups
management.endpoint.health.group.readiness.include=readinessState,db,redis

# File storage (persistent volume)
eligo.file.storage.provider=${FILE_STORAGE_PROVIDER:LOCAL}
eligo.file.storage.local-root=${FILE_STORAGE_LOCAL_ROOT:/data/eligo-files}
eligo.file.image.allowed-content-types=image/jpeg,image/png
eligo.file.image.max-size=10MB
eligo.file.temporary-ttl=PT24H
eligo.file.export.max-files=20
eligo.file.export.max-structured-bytes=5242880
eligo.file.export.max-total-bytes=52428800

# Dev seed (disabled by default in docker)
eligo.organization.dev-seed.enabled=false

# 测试阶段安全开关：容器内默认开启校验，需要免登录测试时设 ELIGO_SECURITY_ENABLED=false
eligo.security.enabled=${ELIGO_SECURITY_ENABLED:true}
eligo.security.dev-user-id=${DEV_USER_ID:1}
eligo.security.dev-session-key=${DEV_SESSION_KEY:dev-session}
eligo.security.dev-admin=${DEV_ADMIN:false}
