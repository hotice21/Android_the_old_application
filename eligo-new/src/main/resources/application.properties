spring.application.name=eligo-server
spring.profiles.default=local

server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true

logging.pattern.level=%5p [requestId:%X{requestId:-}]

# RestClient 全局超时（微信 HTTP 调用使用；原来在 WechatRestClientFactory 内
# 覆盖请求工厂，会导致 MockRestServiceServer 失效，故改为全局配置）
spring.http.client.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT:3s}
spring.http.client.read-timeout=${HTTP_CLIENT_READ_TIMEOUT:5s}

eligo.security.jwt.issuer=eligo
eligo.security.jwt.access-token-ttl=PT15M
eligo.security.jwt.refresh-token-ttl=P30D
eligo.security.jwt.clock-skew=PT30S
eligo.security.jwt.signing-key-base64=${JWT_SIGNING_KEY_BASE64:}

eligo.security.sensitive-data.encryption-key-base64=${DATA_ENCRYPTION_KEY_BASE64:}
eligo.security.sensitive-data.lookup-key-base64=${DATA_LOOKUP_KEY_BASE64:}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

spring.flyway.enabled=false
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.global-config.banner=false

eligo.recommendation.enabled=${ELIGO_RECOMMENDATION_ENABLED:false}
eligo.recommendation.qdrant-url=${ELIGO_RECOMMENDATION_QDRANT_URL:http://127.0.0.1:6334}
eligo.recommendation.qdrant-api-key=${ELIGO_RECOMMENDATION_QDRANT_API_KEY:}
eligo.recommendation.collection=${ELIGO_RECOMMENDATION_COLLECTION:eligo_post_recommendation_bge_m3_v1}
eligo.recommendation.vector-size=${ELIGO_RECOMMENDATION_VECTOR_SIZE:1024}
eligo.recommendation.model=${ELIGO_RECOMMENDATION_MODEL:bge-m3}
eligo.recommendation.model-version=${ELIGO_RECOMMENDATION_MODEL_VERSION:bge-m3-v1}
eligo.recommendation.ollama-url=${ELIGO_RECOMMENDATION_OLLAMA_URL:http://127.0.0.1:11434}
eligo.recommendation.candidate-limit=${ELIGO_RECOMMENDATION_CANDIDATE_LIMIT:200}
eligo.recommendation.lookback-days=${ELIGO_RECOMMENDATION_LOOKBACK_DAYS:90}
eligo.recommendation.snapshot-ttl=${ELIGO_RECOMMENDATION_SNAPSHOT_TTL:10m}
eligo.recommendation.embedding-timeout=${ELIGO_RECOMMENDATION_EMBEDDING_TIMEOUT:2s}
eligo.recommendation.qdrant-timeout=${ELIGO_RECOMMENDATION_QDRANT_TIMEOUT:500ms}
eligo.recommendation.worker-enabled=${ELIGO_RECOMMENDATION_WORKER_ENABLED:false}
eligo.recommendation.worker-batch-size=${ELIGO_RECOMMENDATION_WORKER_BATCH_SIZE:20}
eligo.recommendation.max-attempts=${ELIGO_RECOMMENDATION_MAX_ATTEMPTS:8}
eligo.recommendation.processing-lease=${ELIGO_RECOMMENDATION_PROCESSING_LEASE:5m}
eligo.recommendation.failed-retry-cooldown=${ELIGO_RECOMMENDATION_FAILED_RETRY_COOLDOWN:6h}
eligo.recommendation.backfill-enabled=${ELIGO_RECOMMENDATION_BACKFILL_ENABLED:false}
