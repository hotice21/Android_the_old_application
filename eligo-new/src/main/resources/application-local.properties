spring.config.activate.on-profile=local
spring.config.import=optional:file:./.env[.properties]

eligo.organization.dev-seed.enabled=${ELIGO_ORGANIZATION_DEV_SEED_ENABLED:false}
eligo.organization.dev-seed.organization-id=${ELIGO_ORGANIZATION_DEV_SEED_ORGANIZATION_ID:1900000000000000401}
eligo.organization.dev-seed.organization-member-id=${ELIGO_ORGANIZATION_DEV_SEED_ORGANIZATION_MEMBER_ID:1900000000000000402}
eligo.organization.dev-seed.owner-user-id=${ELIGO_ORGANIZATION_DEV_SEED_OWNER_USER_ID:0}

server.port=${SERVER_PORT:8080}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:${MYSQL_PORT:3306}/${MYSQL_DATABASE:eligo}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:eligo}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

management.endpoint.health.group.readiness.include=readinessState,db,redis

eligo.file.storage.provider=LOCAL
eligo.file.storage.local-root=.data/eligo-files
eligo.file.image.allowed-content-types=image/jpeg,image/png
eligo.file.image.max-size=10MB
eligo.file.temporary-ttl=PT24H
eligo.file.export.max-files=20
eligo.file.export.max-structured-bytes=5242880
eligo.file.export.max-total-bytes=52428800

# 测试阶段安全开关：默认开启校验，需要免登录测试时设 ELIGO_SECURITY_ENABLED=false
eligo.security.enabled=${ELIGO_SECURITY_ENABLED:true}
eligo.security.dev-user-id=${DEV_USER_ID:1}
eligo.security.dev-session-key=${DEV_SESSION_KEY:dev-session}
eligo.security.dev-admin=${DEV_ADMIN:false}
