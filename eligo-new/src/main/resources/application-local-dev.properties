spring.config.activate.on-profile=local-dev

# 端口（避开被占用的 8080）
server.port=${SERVER_PORT:8081}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# H2 内存数据库（MySQL 兼容模式，方便本地无 MySQL 环境启动）
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DB_URL:jdbc:h2:mem:eligo;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 控制台（开发调试用）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Redis 指向本地；启动时不会立即连接，调用相关功能时才会报错
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT 与敏感数据密钥（Base64 编码的 32 字节值）
eligo.security.jwt.signing-key-base64=${JWT_SIGNING_KEY_BASE64:IB8eHRwbGhkYFxYVFBMSERAPDg0MCwoJCAcGBQQDAgE=}
eligo.security.sensitive-data.encryption-key-base64=${DATA_ENCRYPTION_KEY_BASE64:AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=}
eligo.security.sensitive-data.lookup-key-base64=${DATA_LOOKUP_KEY_BASE64:Hx4dHBsaGRgXFhUUExIREA8ODQwLCgkIBwYFBAMCAQA=}

# 测试阶段：默认关闭所有鉴权/会话/账号限制校验（可用 ELIGO_SECURITY_ENABLED=true 临时打开）
eligo.security.enabled=${ELIGO_SECURITY_ENABLED:false}
eligo.security.dev-user-id=${DEV_USER_ID:1}
eligo.security.dev-session-key=${DEV_SESSION_KEY:dev-session}
eligo.security.dev-admin=${DEV_ADMIN:false}

# 文件存储（本地）
eligo.file.storage.provider=LOCAL
eligo.file.storage.local-root=.data/eligo-files
eligo.file.image.allowed-content-types=image/jpeg,image/png
eligo.file.image.max-size=10MB
eligo.file.temporary-ttl=PT24H

# 推荐功能默认关闭
eligo.recommendation.enabled=false

# Flyway 保持禁用（H2 下迁移脚本可能不兼容）
spring.flyway.enabled=false

management.endpoint.health.group.readiness.include=readinessState
