        尚未到达 endsAt 的 HIDDEN 活动仍允许其发起者管理已有参与者。
        活动不存在、DRAFT 或当前用户无管理权限时统一返回 HTTP 404，不泄露活动或参与记录。
        成功后参与关系转为 TERMINATED，terminationReason 设为 REMOVED_BY_OWNER，
        并在同一事务中原子减少 participantCount。
        已因 REMOVED_BY_OWNER 终止时幂等返回当前结果与 200，不再次改变人数。
        已主动取消或因活动取消终止的记录返回业务码 11708 和 HTTP 409；从未报名返回 HTTP 404。
        其他仍可管理记录在活动已取消时返回 11706/409，在 now 大于或等于 endsAt 时返回 11707/409。
        判定顺序固定为管理权限与资源可见性、参与记录不存在、REMOVED_BY_OWNER 幂等、
        当前参与记录不可移除、活动取消、活动结束、执行移除。
