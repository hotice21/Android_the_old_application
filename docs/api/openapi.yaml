    PersonalActivityCreateRequest:
      type: object
      additionalProperties: false
      required: [title]
      description: |
        该接口固定创建 DRAFT，只保存发布待办内容，不执行发布；后续通过 publication 命令发布。
        草稿仅要求非空标题。发布命令会校验标题、分类、描述、封面、报名时间、活动时间、区县、
        详细地址和人数上限等公共发布字段完整，并校验以下时间顺序。
        时间必须满足 registrationStartsAt < registrationEndsAt <= startsAt < endsAt。
        coverFileId 不得出现在 mediaFileIds 中，数组省略时按空数组处理。
        所有图片必须由当前操作人上传、用途为 ACTIVITY 且处于可关联状态；关联后激活。
        字符串由服务端去除首尾空白，选填字符串处理后为空时保存为 null。
        latitude 与 longitude 必须同时为空或同时有值，非空时统一使用 GCJ-02；草稿允许同时为空，发布前必须同时有值。
        placeName 表示集合地点名称，草稿允许为空，发布时不得为空。
        coordinateSystem 在有坐标时可省略并默认 GCJ-02，显式值只接受 GCJ-02；无坐标时必须为空。
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 20
        categoryCode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityCategory"
        description:
          type: string
          maxLength: 5000
          nullable: true
        coverFileId:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Id"
        mediaFileIds:
          type: array
          maxItems: 5
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/Id"
        registrationStartsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        registrationEndsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        startsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        endsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        regionCode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityRegionCode"
        addressDetail:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
        placeName:
          $ref: "#/components/schemas/ActivityPlaceName"
        latitude:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityLatitude"
        longitude:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityLongitude"
        coordinateSystem:
          $ref: "#/components/schemas/ActivityCoordinateSystem"
        topics:
          $ref: "#/components/schemas/ActivityTopics"
        capacity:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        signupDetails:
          type: string
          maxLength: 2000
          nullable: true
        organizerMessage:
          type: string
          maxLength: 1000
          nullable: true
        registrationGender:
          $ref: "#/components/schemas/ActivityRegistrationGender"
        organizerPhone:
          type: string
          maxLength: 32
          nullable: true
        organizerWechat:
          type: string
          maxLength: 64
          nullable: true
        organizerWechatQrFileId:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Id"
        refundPolicy:
          type: string
          nullable: true
          description: 必须传 null；当前版本不启用退款政策。

