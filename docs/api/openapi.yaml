        PUBLISHED + FOLLOWERS_ONLY 在读取时实时检查当前关注关系，个人作者本人或企业当前有效且唯一的 OWNER
        也可读取自己主体的图片；PRIVATE 只允许个人作者本人或企业当前有效且唯一的 OWNER。
        当前有管理权限的作者还可预览 DRAFT、HIDDEN 动态图片；DELETED 或未被动态引用时按 404 处理。
        所有 POST 图片响应统一使用 no-store，避免动态隐藏或删除后稳定 URL 的缓存继续返回旧内容。
        携带 Bearer 令牌时，上传者还可预览尚有效的 TEMPORARY 文件。
        无权访问、已删除、检查未通过或已过期统一按 404 处理。
        ACTIVITY 文件匿名读取使用 no-store；除 POST 外的其他公开文件使用 public，
        上传者预览使用 private。
      x-m2-extension-status: IMPLEMENTED
      x-m4-extension-status: IMPLEMENTED
      security:
        - {}
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: 文件二进制内容
          headers:
            Cache-Control:
              description: 所有 POST 文件内容使用 no-store；ACTIVITY 匿名内容使用 no-store；其他公开文件使用 public，上传者预览使用 private。
              schema:
                type: string
              example: no-store
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            application/zip:
              schema:
                type: string
                format: binary
        default:
          $ref: "#/components/responses/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgreementId:
      name: agreementId
      in: path
      required: true
      description: 十进制大编号；JavaScript 客户端必须按字符串保存。
      schema:
        $ref: "#/components/schemas/Id"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: 企业业务编号；JavaScript 客户端必须按字符串保存。
      schema:
        $ref: "#/components/schemas/Id"
    ActivityId:
      name: activityId
      in: path
      required: true
      description: 活动业务编号；JavaScript 客户端必须按字符串保存。
      schema:
        $ref: "#/components/schemas/Id"
    UserId:
      name: userId
      in: path
      required: true
      description: 用户业务编号；JavaScript 客户端必须按字符串保存。
      schema:
        $ref: "#/components/schemas/Id"
    PostId:
      name: postId
      in: path
      required: true
      description: 动态业务编号；JavaScript 客户端必须按字符串保存。
      schema:
        $ref: "#/components/schemas/Id"
    Cursor:
      name: cursor
      in: query
      required: false
      description: 后端生成的不透明分页游标，客户端不得解析或改写。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    FilterBoundCursor:
      name: cursor
      in: query
      required: false
      description: |
        M4 列表使用的后端不透明分页游标，客户端不得解析或改写。游标与产生它的筛选条件和排序方式绑定；
        改变筛选或排序后复用旧游标属于无效请求，返回 HTTP 400。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    RecommendedCursor:
      name: cursor
      in: query
      required: false
      description: |
        推荐流专用的不透明游标，客户端不得解析或改写。游标绑定当前用户、推荐模式、
        Redis 快照和首请求 limit；快照有效期为 10 分钟。游标被篡改或快照过期返回 10001/400，
        游标由服务端使用 HMAC-SHA256 签名，客户端应从第一页重新请求；不得与公开动态、
        关注流或其他列表游标混用。
      schema:
        type: string
        minLength: 1
        maxLength: 512
    ActivityLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ParticipationLimit:
      name: limit
      in: query
      required: false
      description: 单页返回数量。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    FollowLimit:
      name: limit
      in: query
      required: false
      description: 单页返回数量。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    PostLimit:
      name: limit
      in: query
      required: false
      description: 单页返回数量。
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    RecommendedLimit:
      name: limit
      in: query
      required: false
      description: 推荐流单页返回数量。
      schema:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
    PublicActivityStatus:
      name: status
      in: query
      required: false
      description: 公开列表默认只查询已发布活动。
      schema:
        $ref: "#/components/schemas/PublicActivityStatus"
    ManagedActivityStatus:
      name: status
      in: query
      required: false
      description: 不传时查询当前账号可管理的全部状态。
      schema:
        $ref: "#/components/schemas/ActivityStatus"
    ActivityOwnerTypeFilter:
      name: ownerType
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ActivityOwnerType"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        创建命令的幂等键。结果在当前操作人、发布主体和键值范围内保留 24 小时。
        重放不延长窗口；活动或动态草稿删除也不缩短原 24 小时窗口。
        窗口到期后由请求事务先同步释放过期占用，再允许同键重新创建；后台清理延迟不得延长窗口。
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
  responses:
    VoidSuccess:
      description: 操作成功
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/VoidResult"
    Error:
      description: |
        统一错误响应。常见业务码：
        10000-10999 通用错误；11001-11005 登录会话；
        11101-11103 手机与设备；11201-11203 资料；
        11301-11302 协议；11401-11404 文件；11501-11503 账号数据；
        11601 幂等键冲突；11602 活动状态冲突；11603 乐观锁版本冲突；11604 活动容量冲突；
        11605 幂等请求对应的活动草稿已删除。
        11701 报名尚未开始；11702 报名已经截止；11703 活动名额已满；
        11704 活动发起者不能报名自己的活动；11705 活动已经开始；
        11706 活动已取消；11707 活动已结束；11708 当前参与记录不可由发起者移除；
        11709 已被活动发起者移除，不能再次报名；11710 不符合活动报名性别限制。
        11801 不能关注自己。
        11901 动态创建幂等键冲突；11902 动态状态冲突；11903 动态版本冲突；
        11904 幂等请求对应的动态草稿已删除；11905 动态内容未通过安全检查；
        11906 引用活动不可用。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResult"
    EmailAlreadyUsed:
      description: 邮箱已被其他账号使用，对应业务码 11203 和 HTTP 409。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResult"
          example:
            code: 11203
            message: 邮箱已被使用
            data: null
            requestId: "019fa7f8b1aa7258"
            timestamp: "2026-08-04T08:00:00Z"
  schemas:
    Id:
      type: string
      minLength: 1
      pattern: "^[1-9][0-9]*$"
      example: "1900000000000000201"
    Instant:
      type: string
      format: date-time
      example: "2026-07-29T08:00:00Z"
    ResultMeta:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code:
          type: integer
          enum: [0]
        message:
          type: string
          example: 成功
        requestId:
          type: string
          example: 019fa7f8b1aa7253
        timestamp:
          $ref: "#/components/schemas/Instant"
    ErrorResult:
      type: object
      required: [code, message, data, requestId, timestamp]
      properties:
        code:
          type: integer
          minimum: 1
          example: 10001
        message:
          type: string
          example: 参数校验失败
        data:
          nullable: true
          description: 参数校验失败时可能为 FieldValidationError 数组。
        requestId:
          type: string
        timestamp:
          $ref: "#/components/schemas/Instant"
    VoidResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              nullable: true
              example: null

    PingResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    PingResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/PingResponse"

    WechatLoginRequest:
      type: object
      required:
        - wechatCode
        - installationId
        - deviceName
        - platform
        - appVersion
      properties:
        wechatCode:
          type: string
          minLength: 1
          maxLength: 128
        installationId:
          type: string
          minLength: 16
          maxLength: 128
        deviceName:
          type: string
          minLength: 1
          maxLength: 64
        platform:
          type: string
          minLength: 1
          enum: [WECHAT_MINIPROGRAM]
        osVersion:
          type: string
          maxLength: 32
          nullable: true
        appVersion:
          type: string
          minLength: 1
          maxLength: 32
        regionCode:
          type: string
          maxLength: 32
          nullable: true
    RefreshTokenRequest:
      type: object
      required: [refreshToken, installationId]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 2048
        installationId:
          type: string
          minLength: 16
          maxLength: 128
    LoginResponse:
      type: object
      required:
        - userId
        - accountStatus
        - sessionId
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - profileCompleted
        - pendingAgreementIds
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        accountStatus:
          type: string
          example: ACTIVE
        sessionId:
          $ref: "#/components/schemas/Id"
        accessToken:
          type: string
          writeOnly: true
        accessTokenExpiresAt:
          $ref: "#/components/schemas/Instant"
        refreshToken:
          type: string
          writeOnly: true
        refreshTokenExpiresAt:
          $ref: "#/components/schemas/Instant"
        profileCompleted:
          type: boolean
        pendingAgreementIds:
          type: array
          items:
            $ref: "#/components/schemas/Id"
    LoginResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/LoginResponse"

    AgreementType:
      type: string
      enum: [USER_AGREEMENT, PRIVACY_POLICY]
    AgreementSummary:
      type: object
      required:
        - agreementId
        - type
        - versionCode
        - title
        - requiresReconsent
        - effectiveAt
        - agreed
      properties:
        agreementId:
          $ref: "#/components/schemas/Id"
        type:
          $ref: "#/components/schemas/AgreementType"
        versionCode:
          type: string
        title:
          type: string
        requiresReconsent:
          type: boolean
        effectiveAt:
          $ref: "#/components/schemas/Instant"
        agreed:
          type: boolean
          nullable: true
          description: 匿名访问时为 null。
    AgreementDetail:
      allOf:
        - $ref: "#/components/schemas/AgreementSummary"
        - type: object
          required: [content, contentHash]
          properties:
            content:
              type: string
            contentHash:
              type: string
              pattern: "^[a-fA-F0-9]{64}$"
    AgreementConsent:
      type: object
      required: [agreementId, agreedAt]
      properties:
        agreementId:
          $ref: "#/components/schemas/Id"
        agreedAt:
          $ref: "#/components/schemas/Instant"
    AgreementItemsResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  items:
                    $ref: "#/components/schemas/AgreementSummary"
    AgreementDetailResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AgreementDetail"
    AgreementConsentResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/AgreementConsent"

    UpdateProfileRequest:
      type: object
      required: [birthDate, gender, provinceCode, cityCode, districtCode]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          nullable: true
          description: 设计稿中的“姓名”沿用此字段；已有昵称时可省略，首次设置必须提供，资料完成时不能为空。
        birthDate:
          type: string
          format: date
        gender:
          type: string
          minLength: 1
          enum: [MALE, FEMALE, OTHER_OR_UNDISCLOSED]
        provinceCode:
          type: string
          minLength: 1
        cityCode:
          type: string
          minLength: 1
        districtCode:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: 选填且填写后全局唯一；省略、null 或空字符串表示清空，非空时服务端去除首尾空白并转为小写后保存和判重。
        bio:
          type: string
          maxLength: 1000
          nullable: true
          description: 选填，不参与资料完成判定。
      example:
        nickname: 小艾
        birthDate: "2000-01-02"
        gender: FEMALE
        provinceCode: "44"
        cityCode: "4401"
        districtCode: "440106"
        email: null
        bio: 周末喜欢徒步和看展
    UpdateAvatarRequest:
      type: object
      required: [fileId]
      properties:
        fileId:
          $ref: "#/components/schemas/Id"
      example:
        fileId: "1900000000000000301"
    UpdateNicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          minLength: 2
          maxLength: 20
      example:
        nickname: 小艾
    UpdateInterestsRequest:
      type: object
      required: [interestTagIds]
      properties:
        interestTagIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Id"
      example:
        interestTagIds:
          - "1900000000000001001"
          - "1900000000000001002"
    AvatarView:
      type: object
      required: [fileId, url]
      properties:
        fileId:
          $ref: "#/components/schemas/Id"
        url:
          type: string
      example:
        fileId: "1900000000000000301"
        url: /api/v1/files/1900000000000000301/content
    RegionView:
      type: object
      required:
        - provinceCode
        - provinceName
        - cityCode
        - cityName
        - districtCode
        - districtName
      properties:
        provinceCode:
          type: string
        provinceName:
          type: string
        cityCode:
          type: string
        cityName:
          type: string
        districtCode:
          type: string
        districtName:
          type: string
    ProfilePhoneBindingView:
      type: object
      required: [bound]
      properties:
        bound:
          type: boolean
        maskedPhone:
          type: string
          nullable: true
          description: 仅返回脱敏值；未绑定时为 null。
      example:
        bound: true
        maskedPhone: "138****8000"
    InterestTag:
      type: object
      required: [interestTagId, code, name, sortOrder]
      properties:
        interestTagId:
          $ref: "#/components/schemas/Id"
        code:
          type: string
        name:
          type: string
        sortOrder:
          type: integer
      example:
        interestTagId: "1900000000000001001"
        code: OUTDOOR
        name: 户外
        sortOrder: 10
    MyProfile:
      type: object
      required:
        - userId
        - nickname
        - avatar
        - birthDate
        - gender
        - region
        - email
        - bio
        - interestTags
        - phoneBinding
        - profileCompleted
        - completedAt
        - nextNicknameChangeAt
      properties:
        userId:
          $ref: "#/components/schemas/Id"
        nickname:
          type: string
          minLength: 2
          maxLength: 20
          nullable: true
          description: 设计稿中的“姓名”。
        avatar:
          nullable: true
          description: 选填，不参与资料完成判定。
          allOf:
            - $ref: "#/components/schemas/AvatarView"
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER_OR_UNDISCLOSED]
          nullable: true
        region:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RegionView"
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
          description: 仅向当前登录用户本人完整回显；未填写时为 null。
        bio:
          type: string
          nullable: true
          description: 选填，不参与资料完成判定。
        interestTags:
          type: array
          items:
            $ref: "#/components/schemas/InterestTag"
        phoneBinding:
          $ref: "#/components/schemas/ProfilePhoneBindingView"
        profileCompleted:
          type: boolean
          description: 姓名、生日、地址、性别、有效手机号和至少一个有效兴趣标签均齐全时为 true；邮箱、头像和简介不参与判定。
        completedAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        nextNicknameChangeAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
      example:
        userId: "1900000000000000201"
        nickname: 小艾
        avatar: null
        birthDate: "2000-01-02"
        gender: FEMALE
        region:
          provinceCode: "44"
          provinceName: 广东省
          cityCode: "4401"
          cityName: 广州市
          districtCode: "440106"
          districtName: 天河区
        email: xiaoyi@example.com
        bio: 周末喜欢徒步和看展
        interestTags:
          - interestTagId: "1900000000000001001"
            code: OUTDOOR
            name: 户外
            sortOrder: 10
        phoneBinding:
          bound: true
          maskedPhone: "138****8000"
        profileCompleted: true
        completedAt: "2026-08-04T08:00:00Z"
        nextNicknameChangeAt: null
    MyProfileResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/MyProfile"
    UserCapability:
      type: string
      description: 当前用户可执行的后端能力；企业能力是在个人账号上叠加，不是独立登录身份。
      enum:
        - PUBLIC_READ
        - FOLLOW
        - PARTICIPATE
        - PUBLISH_PERSONAL_ACTIVITY
        - PUBLISH_PERSONAL_POST
        - PUBLISH_ORGANIZATION_ACTIVITY
        - PUBLISH_ORGANIZATION_POST
        - MANAGE_ORGANIZATION
    UserCapabilities:
      type: object
      required: [profileCompleted, capabilities]
      properties:
        profileCompleted:
          type: boolean
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/UserCapability"
    UserCapabilitiesResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/UserCapabilities"
    OrganizationRole:
      type: string
      enum: [OWNER]
    MyOrganizationSummary:
      type: object
      required: [organizationId, name, avatar, role]
      properties:
        organizationId:
          $ref: "#/components/schemas/Id"
        name:
          type: string
          maxLength: 256
        avatar:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/AvatarView"
        role:
          $ref: "#/components/schemas/OrganizationRole"
    MyOrganizationItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 1
          items:
            $ref: "#/components/schemas/MyOrganizationSummary"
    MyOrganizationItemsResult:
      allOf:
        - $ref: "#/components/schemas/ResultMeta"
        - type: object
          required: [data]
          properties:
            data:
              $ref: "#/components/schemas/MyOrganizationItems"
    ActivityOwnerType:
      type: string
      enum: [USER, ORGANIZATION]
    ActivityStatus:
      type: string
      enum: [DRAFT, PUBLISHED, CANCELLED, ENDED, HIDDEN]
    PublicActivityStatus:
      type: string
      enum: [PUBLISHED, CANCELLED, ENDED]
      default: PUBLISHED
    ActivityCategory:
      type: string
      enum:
        - HIKING
        - CAMPING
        - MOUNTAINEERING
        - RUNNING
        - CYCLING
        - FITNESS
        - BALL_SPORTS
        - WATER_SPORTS
        - TRAVEL
        - FOOD
        - MUSIC
        - MOVIE
        - READING
        - PHOTOGRAPHY
        - BOARD_GAMES
        - GAMING
        - PETS
        - PARENT_CHILD
        - VOLUNTEERING
        - OTHER
      description: 活动单选主分类；后续可以追加值，已有值原则上不改名或删除。
    ActivityRegionCode:
      type: string
      minLength: 6
      maxLength: 9
      pattern: "^[0-9]{6}([0-9]{3})?$"
      description: |
        编码来源为 AreaCity-JsSpider-StatsGov 2025.251231.260403 发布快照，使用项目
        规范化后的第三级节点原始 id。活动 regionCode 与个人资料 districtCode 使用同一份
        内置快照；后端仍须校验该编码对应实际区县级节点。
    ActivityPlaceName:
      type: string
      maxLength: 100
      nullable: true
      description: 集合地点名称；草稿允许为空，新活动发布时不得为空。历史已发布活动可能返回 null，修改后再次保存时必须补齐。
    ActivityCoordinateSystem:
      type: string
      enum: [GCJ-02]
      nullable: true
      description: 有坐标时固定返回或接受 GCJ-02；请求有坐标但省略时服务端默认 GCJ-02，无坐标时必须为 null。
    ActivityTopics:
      type: array
      maxItems: 5
      default: []
      description: 活动自由文本话题；每项去除首尾空白后按忽略大小写去重，保留首次展示文本和请求顺序。
      items:
        type: string
        minLength: 1
        maxLength: 20
    ActivityLatitude:
      type: number
      format: double
      minimum: -90
      maximum: 90
      multipleOf: 0.0000001
      x-coordinate-reference-system: GCJ-02
      description: GCJ-02（国测局坐标系）的集合地点纬度，最多 7 位小数。
    ActivityLongitude:
      type: number
      format: double
      minimum: -180
      maximum: 180
      multipleOf: 0.0000001
      x-coordinate-reference-system: GCJ-02
      description: GCJ-02（国测局坐标系）的集合地点经度，最多 7 位小数。
    ActivityRegistrationStatus:
      type: string
      enum: [NOT_STARTED, OPEN, FULL, CLOSED, CANCELLED, ENDED]
      description: 根据活动状态、报名时间和名额派生的只读报名窗口状态；HIDDEN 活动固定返回 CLOSED，表示当前不可报名。
    ParticipationStatus:
      type: string
      enum: [ACTIVE, CANCELLED, TERMINATED]
      description: |
        ACTIVE 表示有效、未取消且未终止的报名；活动正常结束后仍保持 ACTIVE。
        CANCELLED 表示用户主动取消；TERMINATED 表示活动取消或被发起者移除。
    ParticipationTerminationReason:
      type: string
      enum: [ACTIVITY_CANCELLED, REMOVED_BY_OWNER]
      description: TERMINATED 的固定终止原因；其他参与状态返回 null。
    ActivityFeeType:
      type: string
      enum: [FREE]
      description: 当前版本仅支持免费活动；refundPolicy 字段必须为 null，不启用支付和退款逻辑。
    ActivityRegistrationGender:
      type: string
      enum: [UNLIMITED, MALE, FEMALE]
      description: 报名者性别限制；UNLIMITED 表示不限，MALE 表示仅男，FEMALE 表示仅女。
    FilePurpose:
      type: string
      enum: [AVATAR, ACTIVITY, ACTIVITY_CONTACT_QR, POST]

    FollowTargetType:
      type: string
      enum: [USER, ORGANIZATION]
    FollowListSort:
      type: string
      enum: [RECENT, EARLIEST]
      default: RECENT
    PostAuthorType:
      type: string
      enum: [USER, ORGANIZATION]
    PostStatus:
      type: string
      enum: [DRAFT, PUBLISHED, DELETED, HIDDEN]
    ManagedPostStatus:
      type: string
      enum: [DRAFT, PUBLISHED, HIDDEN]
      description: 管理列表不返回已软删除动态。
    PostVisibility:
      type: string
      enum: [PUBLIC, FOLLOWERS_ONLY, PRIVATE]
      default: PUBLIC
      description: |
        PUBLIC 允许所有人读取；FOLLOWERS_ONLY 在读取时实时检查当前关注关系，个人作者本人或
        企业当前有效且唯一的 OWNER 也可读取自己主体的动态；
        PRIVATE 个人动态只允许作者本人，企业动态只允许当前有效且唯一的 OWNER。

