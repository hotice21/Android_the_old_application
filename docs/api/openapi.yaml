    put:
      tags: [Post]
      operationId: publishPost
      summary: 发布动态草稿
      description: |
        仅允许 DRAFT 转为 PUBLISHED：发布要求标题有效，且正文或图片至少存在一项；
        重新校验资料完成度、活动引用和全部图片。已经 PUBLISHED 时幂等返回当前结果。
        HIDDEN 是平台内容安全状态，作者不得自行恢复，调用本接口返回 11902/409；
        HIDDEN 转回 PUBLISHED 仅允许未公开的内部平台审核或申诉流程执行，并保留原 publishedAt。
        个人动态要求 PUBLISH_PERSONAL_POST；企业动态要求企业处于 DEV_ENABLED、当前用户具备
        PUBLISH_ORGANIZATION_POST，且是当前有效且唯一的 OWNER；无管理权限统一返回 404。
        判定时先确认当前资源管理权限；已经 PUBLISHED 时优先幂等返回，不因资料或企业能力后来变化而重复写入；
