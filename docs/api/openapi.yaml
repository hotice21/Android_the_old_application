        MySQL 在返回前重新校验动态、作者和公开可见性。Redis 快照保留 10 分钟，
        推荐游标独立绑定用户、快照、模式和首请求 limit；快照过期或游标无效返回 10001/400。
        本接口不改变 GET /api/v1/feed/following 的实时关注流语义。
