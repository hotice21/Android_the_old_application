        DRAFT 仅要求标题；PUBLISHED 更新时必须保持全部公共发布字段完整。
        PUBLISHED 更新时原 endsAt 和本请求替换后的 endsAt 都必须晚于服务端本次命令判定时刻。
        时间顺序、图片归属、ACTIVITY 用途、可关联状态、激活和去空白规则与创建相同。
        企业请求不接受 signupDetails 或 organizerMessage。
        latitude 与 longitude 必须同时为空或同时有值，非空时统一使用 GCJ-02；PUBLISHED 更新后两者不得为空。
        placeName 表示集合地点名称，PUBLISHED 更新后不得为空；历史数据若缺失必须在本次更新补齐。
        coordinateSystem 在有坐标时可省略并默认 GCJ-02，显式值只接受 GCJ-02；无坐标时必须为空。
      properties:
        version:
          type: integer
          format: int32
          minimum: 0
        title:
          type: string
          minLength: 1
          maxLength: 20
        categoryCode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityCategory"
        description:
          type: string
          maxLength: 5000
          nullable: true
        coverFileId:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Id"
        mediaFileIds:
          type: array
          maxItems: 5
          uniqueItems: true
          default: []
          items:
            $ref: "#/components/schemas/Id"
        registrationStartsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        registrationEndsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        startsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        endsAt:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Instant"
        regionCode:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityRegionCode"
        addressDetail:
          type: string
          minLength: 1
          maxLength: 512
          nullable: true
        placeName:
          $ref: "#/components/schemas/ActivityPlaceName"
        latitude:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityLatitude"
        longitude:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/ActivityLongitude"
        coordinateSystem:
          $ref: "#/components/schemas/ActivityCoordinateSystem"
        topics:
          $ref: "#/components/schemas/ActivityTopics"
        capacity:
          type: integer
          format: int32
          minimum: 1
          nullable: true
        registrationGender:
          $ref: "#/components/schemas/ActivityRegistrationGender"
        organizerPhone:
          type: string
          maxLength: 32
          nullable: true
        organizerWechat:
          type: string
          maxLength: 64
          nullable: true
        organizerWechatQrFileId:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Id"
        refundPolicy:
          type: string
          nullable: true
          description: 必须传 null；当前版本不启用退款政策。

    NicknameChange:
