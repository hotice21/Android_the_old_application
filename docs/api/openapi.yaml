  /api/v1/account/deactivation:
    post:
      tags: [Account]
      operationId: requestDeactivation
      summary: 申请注销账号
      description: |
        首次申请返回 201；重复读取现有申请返回 200。
        存在以下任一业务责任时拒绝注销申请并返回 11501/409：
        用户存在 ACTIVE 报名，且关联活动尚未有效结束；
        用户是尚未有效结束的个人活动发起者；
        用户是尚未有效结束的企业活动所属企业当前有效且唯一的 OWNER。
        正常结束后保留的 ACTIVE 报名历史不阻断注销；
        DRAFT、CANCELLED、ENDED 或 endsAt 已到达的活动也不阻断注销。
        本接口只创建注销申请，以下 M4 规则在实际注销执行时生效：
        物理删除以该用户为关注者或被关注者的用户关注关系，以及该用户发起的企业关注关系；
        个人 DRAFT 动态转为 DELETED，个人 PUBLISHED 动态转为 HIDDEN 并记录 ACCOUNT_DEACTIVATED，已 HIDDEN 保持不变；
        不删除企业动态，其受限操作审计按既有 M1 匿名化规则保留，动态文件访问随最终可见状态收紧。
      x-m2-extension-status: IMPLEMENTED
      x-m3-extension-status: IMPLEMENTED
      x-m4-extension-status: IMPLEMENTED
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivationRequest"
      responses:
        "200":
          description: 已存在的注销申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivationResult"
        "201":
          description: 已创建注销申请
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivationResult"
        "409":
          $ref: "#/components/responses/Error"
        default:
          $ref: "#/components/responses/Error"
    get:
