openapi: 3.0.3
info:
  title: Eligo Backend API
  version: 1.7.0
  description: |
    Eligo 后端接口的唯一机器可读契约。
    M1 个人资料契约采用“同一账号叠加能力”模型：普通参与和个人发布不拆分账号身份，
    用户与后端预置企业建立有效 OWNER 关系后，再叠加企业操作能力。
    当前不提供企业申请、认证、审核或身份切换接口。
    新增或修改接口时，后端开发者必须在同一个提交中更新本文件。
    除文件内容下载接口外，所有 JSON 响应都使用统一 Result 包装。
  x-generated-from-code-date: 2026-08-22
  x-contract-updated-date: 2026-08-22
  x-m1-contract-status: REVIEW
  x-m2-contract-status: IMPLEMENTED
  x-m3-contract-status: IMPLEMENTED
  x-m4-contract-status: IMPLEMENTED
  x-m4.1-contract-status: IMPLEMENTED
servers:
  - url: http://127.0.0.1:8080
    description: 本机 Docker / 微信开发者工具
tags:
  - name: System
  - name: Auth
  - name: Agreement
  - name: Profile
  - name: Capability
  - name: Organization
  - name: Activity
  - name: Participation
  - name: Favorite
  - name: Comment
  - name: Follow
  - name: Post
  - name: Feed
  - name: Account
  - name: File
security:
  - bearerAuth: []
paths:
  /api/v1/system/ping:
    get:
      tags: [System]
      operationId: ping
      summary: 检查 API 服务是否可用
      security: []
      responses:
        "200":
          description: 服务可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/wechat-login:
    post:
      tags: [Auth]
      operationId: wechatLogin
      summary: 使用微信临时登录凭证登录或创建账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WechatLoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: 轮换刷新令牌并取得新登录令牌
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: 刷新成功；旧 refreshToken 立即失效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 注销当前登录会话
      responses:
        "200":
          $ref: "#/components/responses/VoidSuccess"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/agreements/current:
    get:
      tags: [Agreement]
      operationId: listCurrentAgreements
      summary: 查询当前生效协议
      description: 匿名可访问；带有效令牌时 agreed 返回当前用户的同意状态。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/AgreementType"
      responses:
        "200":
          description: 当前协议列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementItemsResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/agreements/{agreementId}:
    parameters:
      - $ref: "#/components/parameters/AgreementId"
    get:
      tags: [Agreement]
      operationId: getAgreement
      summary: 查询协议正文
      description: 匿名可查看当前生效协议；登录用户还可查看自己曾同意的退休版本。
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: 协议详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementDetailResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/agreements/{agreementId}/consents:
    parameters:
      - $ref: "#/components/parameters/AgreementId"
    post:
      tags: [Agreement]
      operationId: consentAgreement
      summary: 同意一个当前生效协议版本
      description: 首次同意返回 201；重复提交幂等返回 200。
      responses:
        "200":
          description: 已存在同意记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementConsentResult"
        "201":
          description: 已创建同意记录
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgreementConsentResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/profile:
    get:
      tags: [Profile]
      operationId: getMyProfile
      summary: 获取本人资料
      description: |
        仅返回当前登录用户本人的完整资料。邮箱为选填项，仅在本接口回显，不进入公开主页。
        profileCompleted 按姓名（nickname）、生日、地址、性别、有效手机号和至少一个有效兴趣标签实时判定；邮箱、头像和简介选填。
      responses:
        "200":
          description: 本人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResult"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Profile]
      operationId: updateMyProfile
      summary: 更新本人基础资料
      description: |
        保存设计稿中的姓名、生日、地址、性别和选填邮箱；电话号码由手机号绑定接口维护，我的标签由兴趣接口维护。
        当前“姓名”沿用 nickname 字段。邮箱省略、传 null 或空字符串时清空；非空时服务端去除首尾空白并转为小写后保存和判重。
        保存后立即重新计算 profileCompleted；邮箱、头像和简介不参与完成判定。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: 更新后的本人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResult"
        "409":
          $ref: "#/components/responses/EmailAlreadyUsed"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/avatar:
    put:
      tags: [Profile]
      operationId: updateMyAvatar
      summary: 将已上传的临时图片设置为头像
      description: 头像为选填项，不影响 profileCompleted。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvatarRequest"
      responses:
        "200":
          description: 更新后的本人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/nickname:
    patch:
      tags: [Profile]
      operationId: updateMyNickname
      summary: 单独修改昵称
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNicknameRequest"
      responses:
        "200":
          description: 昵称修改结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NicknameChangeResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/interest-tags:
    get:
      tags: [Profile]
      operationId: listInterestTags
      summary: 获取启用的兴趣标签
      description: 当前预置户外、运动、美食、旅行、音乐、电影、阅读、摄影、游戏和宠物10个选项。
      responses:
        "200":
          description: 兴趣标签列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InterestTagItemsResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/interests:
    put:
      tags: [Profile]
      operationId: replaceMyInterests
      summary: 全量替换本人兴趣
      description: 至少选择一个有效标签；保存后立即重新计算 profileCompleted。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInterestsRequest"
      responses:
        "200":
          description: 更新后的本人资料
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/capabilities:
    get:
      tags: [Capability]
      operationId: getMyCapabilities
      summary: 获取当前用户能力
      description: |
        能力由后端根据资料完成度和有效企业 OWNER 关系实时计算，不写入 JWT，也不由前端自行判断。
        资料未完成时只返回 PUBLIC_READ；资料完成后获得 FOLLOW、PARTICIPATE 和个人发布能力；存在有效企业关系时叠加企业能力。
        这是同一账号的能力集合，不代表需要切换账号身份。
      x-m3-extension-status: IMPLEMENTED
      x-m4-extension-status: IMPLEMENTED
      responses:
        "200":
          description: 当前用户能力
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCapabilitiesResult"
              examples:
                incompleteProfile:
                  summary: 资料未完成
                  value:
                    code: 0
                    message: 成功
                    requestId: "019fa7f8b1aa7253"
                    timestamp: "2026-08-04T08:00:00Z"
                    data:
                      profileCompleted: false
                      capabilities: [PUBLIC_READ]
                personalPublisher:
                  summary: 资料完整的普通用户或个人发布者
                  value:
                    code: 0
                    message: 成功
                    requestId: "019fa7f8b1aa7254"
                    timestamp: "2026-08-04T08:00:00Z"
                    data:
                      profileCompleted: true
                      capabilities:
                        - PUBLIC_READ
                        - FOLLOW
                        - PARTICIPATE
                        - PUBLISH_PERSONAL_ACTIVITY
                        - PUBLISH_PERSONAL_POST
                organizationOwner:
                  summary: 同时拥有企业操作能力
                  value:
                    code: 0
                    message: 成功
                    requestId: "019fa7f8b1aa7255"
                    timestamp: "2026-08-04T08:00:00Z"
                    data:
                      profileCompleted: true
                      capabilities:
                        - PUBLIC_READ
                        - FOLLOW
                        - PARTICIPATE
                        - PUBLISH_PERSONAL_ACTIVITY
                        - PUBLISH_PERSONAL_POST
                        - PUBLISH_ORGANIZATION_ACTIVITY
                        - PUBLISH_ORGANIZATION_POST
                        - MANAGE_ORGANIZATION
        default:
          $ref: "#/components/responses/Error"

  /api/v1/users/me/organizations:
    get:
      tags: [Organization]
      operationId: listMyOrganizations
      summary: 获取当前用户可操作的企业
      description: |
        仅返回后端预置且当前有效的 OWNER 企业关系，首版每个用户最多一个、每个企业恰有一个有效 OWNER。
        没有企业能力时返回 items: []。本接口不暴露联系方式密文、内部状态或其他成员信息。
        当前不提供企业自助创建、申请、认证或审核接口。
      responses:
        "200":
          description: 可操作企业列表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyOrganizationItemsResult"
              examples:
                noOrganization:
                  summary: 当前用户没有企业能力
                  value:
                    code: 0
                    message: 成功
                    requestId: "019fa7f8b1aa7256"
                    timestamp: "2026-08-04T08:00:00Z"
                    data:
                      items: []
                organizationOwner:
                  summary: 当前用户是企业唯一负责人
                  value:
                    code: 0
                    message: 成功
                    requestId: "019fa7f8b1aa7257"
                    timestamp: "2026-08-04T08:00:00Z"
                    data:
                      items:
                        - organizationId: "1900000000000000401"
                          name: 山海户外
                          avatar: null
                          role: OWNER
        default:
          $ref: "#/components/responses/Error"

  /api/v1/organizations/{organizationId}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags: [Organization]
      operationId: getPublicOrganization
      summary: 获取企业公开详情
      description: |
        仅返回企业公开资料，不暴露联系电话、唯一 OWNER、内部状态、版本或审计字段。
        followerCount 固定返回按当前公开可用关注者统计的非负数；不可用关注者的关系保留但不计数。
      x-implementation-status: IMPLEMENTED
      x-m4-extension-status: IMPLEMENTED
      security: []
      responses:
        "200":
          description: 企业公开详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicOrganizationDetailResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/activities:
    get:
      tags: [Activity]
      operationId: listPublicActivities
      summary: 游标分页查询公开活动
      description: |
        匿名可访问。默认只返回 PUBLISHED；显式状态筛选还可查询 CANCELLED 或 ENDED。
        活动到达 endsAt 后立即按 ENDED 返回，并从 PUBLISHED 列表移入 ENDED 列表。
        keyword 对标题或描述执行包含匹配；topic 对规范化话题名称执行精确匹配，并与状态、分类、区县和关键词筛选按“且”共同生效。
        未提供 userLatitude 与 userLongitude 时固定按 startsAt ASC、activityId ASC 排序。
        两个用户坐标必须同时提供并使用 GCJ-02；提供后以 Haversine 公式计算整数米距离，按
        distanceMeters ASC、activityId ASC 排序。radiusMeters 仅允许在用户坐标完整时提供。
        距离模式 cursor 与用户坐标、radiusMeters、状态、分类、区县、关键词等筛选条件绑定；
        改变筛选条件后复用旧游标返回 10001/400。cursor 是不透明字符串，客户端不得解析或改写。
      x-implementation-status: IMPLEMENTED
      security: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ActivityLimit"
        - $ref: "#/components/parameters/PublicActivityStatus"
        - name: categoryCode
          in: query
          required: false
          description: 活动单选主分类精确匹配。
          schema:
            $ref: "#/components/schemas/ActivityCategory"
        - name: regionCode
          in: query
          required: false
          description: 区县级行政区划编码精确匹配。
          schema:
            $ref: "#/components/schemas/ActivityRegionCode"
        - name: keyword
          in: query
          required: false
          description: 标题或描述包含匹配；去除首尾空白后最多 20 个 Unicode 码点，空白等同未传。
          schema:
            type: string
            maxLength: 20
        - name: topic
          in: query
          required: false
          description: 活动自由文本话题精确匹配；去除首尾空白并忽略大小写，最多 20 个 Unicode 码点。
          schema:
            type: string
            minLength: 1
            maxLength: 20
        - name: userLatitude
          in: query
          required: false
          description: 用户当前位置纬度；必须与 userLongitude 同时提供，使用 GCJ-02，服务端不保存。
          schema:
            $ref: "#/components/schemas/ActivityLatitude"
        - name: userLongitude
          in: query
          required: false
          description: 用户当前位置经度；必须与 userLatitude 同时提供，使用 GCJ-02，服务端不保存。
          schema:
            $ref: "#/components/schemas/ActivityLongitude"
        - name: radiusMeters
          in: query
          required: false
          description: 以用户坐标为圆心的精确距离过滤半径；未提供完整用户坐标时不得传入。
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50000
      responses:
        "200":
          description: 公开活动分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicActivityPageResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/activities/map:
    get:
      tags: [Activity]
      operationId: listActivitiesOnMap
      summary: 查询地图视野内的公开活动
      description: |
        匿名可访问。只返回数据库状态为 PUBLISHED、尚未到达 endsAt 且坐标完整的活动。
        已取消、已结束、已隐藏或无坐标活动不返回。接口支持两个互斥模式：
        视窗模式必须同时提供四个边界；可选完整 userLatitude/userLongitude，提供后按 distanceMeters ASC、activityId ASC 排序，
        否则按 startsAt ASC、activityId ASC 排序。附近模式必须省略四个边界，同时提供用户坐标和 radiusMeters，
        按 Haversine 整数米距离过滤并按 distanceMeters ASC、activityId ASC 排序。部分边界、单个用户坐标、
        四个边界与 radiusMeters 混用均返回 10001/400。
        响应最多返回 limit 条；truncated=true 表示当前视野内仍有更多结果，客户端应缩小地图范围后重新查询。
        请求边界与响应坐标统一使用 GCJ-02（国测局坐标系），不得直接混入 WGS84 或 BD-09 坐标。
        本接口不保存用户位置，不返回预计车程、天气或路线规划。
      x-implementation-status: IMPLEMENTED
      security: []
      parameters:
        - name: minLatitude
          in: query
          required: false
          description: 地图视野最小纬度；视窗模式下四个边界必须同时提供，附近模式下必须省略。
          schema:
            $ref: "#/components/schemas/ActivityLatitude"
        - name: maxLatitude
          in: query
          required: false
          description: 地图视野最大纬度，必须大于 minLatitude。
          schema:
            $ref: "#/components/schemas/ActivityLatitude"
        - name: minLongitude
          in: query
          required: false
          description: 地图视野最小经度；视窗模式下四个边界必须同时提供，附近模式下必须省略。
          schema:
            $ref: "#/components/schemas/ActivityLongitude"
        - name: maxLongitude
          in: query
          required: false
          description: 地图视野最大经度，必须大于 minLongitude；首版不支持跨越国际日期变更线的视野。
          schema:
            $ref: "#/components/schemas/ActivityLongitude"
        - name: userLatitude
          in: query
          required: false
          description: 用户当前位置纬度；必须与 userLongitude 同时提供，统一使用 GCJ-02，服务端不保存。
          schema:
            $ref: "#/components/schemas/ActivityLatitude"
        - name: userLongitude
          in: query
          required: false
          description: 用户当前位置经度；必须与 userLatitude 同时提供，统一使用 GCJ-02，服务端不保存。
          schema:
            $ref: "#/components/schemas/ActivityLongitude"
        - name: radiusMeters
          in: query
          required: false
          description: 附近模式必填的精确距离半径；不得与四个视窗边界混用。
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 50000
        - name: categoryCode
          in: query
          required: false
          description: 活动单选主分类精确匹配。
          schema:
            $ref: "#/components/schemas/ActivityCategory"
        - name: limit
          in: query
          required: false
          description: 单个地图视野最多返回的活动数量。
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: 地图视野内的公开活动
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityMapResult"
        default:
          $ref: "#/components/responses/Error"

  /api/v1/activities/{activityId}:
    parameters:
      - $ref: "#/components/parameters/ActivityId"
    get:
      tags: [Activity]
      operationId: getPublicActivity
      summary: 获取公开活动详情
      description: |
        匿名可读取 PUBLISHED、CANCELLED 或 ENDED 活动。
        活动到达 endsAt 后，响应中的 status 和 registrationStatus 均为 ENDED。
        携带有效 Bearer 令牌时，同时返回本人参与状态和是否为活动发起者；匿名访问时本人状态为空。
        registrationGender 始终返回活动的报名性别限制；organizerPhone、organizerWechat 和
        organizerWechatQr 仅活动发起者或当前 ACTIVE 报名者可见，其他访问者返回 null。
        DRAFT、HIDDEN、无权访问和不存在统一按 404 处理，避免泄露非公开活动。
      x-implementation-status: IMPLEMENTED
      x-m3-extension-status: IMPLEMENTED
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: 公开活动详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicActivityDetailResult"
        default:
          $ref: "#/components/responses/Error"

    delete:
      tags: [Activity]
      operationId: deleteActivityDraft
      summary: 删除本人或本企业活动草稿
      description: |
        仅资源所有者可操作，不接收请求体。只允许物理删除从未发布的 DRAFT。
        PUBLISHED、CANCELLED、ENDED 或 HIDDEN 返回 HTTP 409。
        资源不存在、重复删除或无管理权限统一返回 HTTP 404。
