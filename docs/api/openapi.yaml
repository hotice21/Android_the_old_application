        已存在 ACTIVE 记录时返回当前结果，不重复占用名额。
        CANCELLED 记录允许重新报名，并重新执行全部报名校验。
        terminationReason 为 REMOVED_BY_OWNER 的 TERMINATED 记录返回“已被活动发起者移除，不能再次报名”，业务码为 11709，HTTP 409。
        重新报名成功时恢复为 ACTIVE，joinedAt 更新为服务端当前时间，并清空 cancelledAt、terminatedAt 和 terminationReason。
        参与关系与 participantCount 在同一事务中原子更新；任一步失败时均不保留部分结果。
        报名冲突分别使用 11701 尚未开始报名、11702 报名截止、11703 名额已满、11704 发起者本人、
        11705 活动已开始、11706 活动已取消、11707 活动已结束、11709 被发起者移除后再次报名和
        11710 不符合报名性别限制，均返回 HTTP 409。
        判定顺序固定为资源可见性、ACTIVE 幂等、被发起者移除、资料完成度、活动取消、活动结束、活动开始、
        报名尚未开始、报名截止、发起者本人、名额已满、报名性别限制；前序条件命中后不再返回后序错误。
